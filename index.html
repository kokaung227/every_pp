<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Papers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📚 Exam Papers</h1>
    <div id="greeting" class="greeting"></div>
    <div id="loader" class="loader">Loading options...</div>
    <div id="filters" style="display: none;">
        <div class="filter-group">
            <label>Exam</label>
            <select id="exam" disabled>
                <option value="">Select exam</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Board</label>
            <select id="board" disabled>
                <option value="">Select board</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Subject</label>
            <select id="subject" disabled>
                <option value="">Select subject</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Year</label>
            <select id="year" disabled>
                <option value="">Select year</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Month</label>
            <select id="month" disabled>
                <option value="">Select month</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Paper</label>
            <select id="paper" disabled>
                <option value="">Select paper</option>
            </select>
        </div>
        <div class="file-type">
            <label>
                <input type="radio" name="fileType" value="qp" checked> 📝 Question Paper
            </label>
            <label>
                <input type="radio" name="fileType" value="ms"> 📋 Mark Scheme
            </label>
        </div>
        <button id="downloadBtn" disabled>⬇️ Download</button>
        <div class="note">Select all options to enable download</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
    <div class="footer">
        Developed by <a href="https://t.me/guyugyi" target="_blank">@guyugyi</a>
    </div>
</body>
</body>
</html>
